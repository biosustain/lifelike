version: "3.8"

# Hasn't been migrated to Arango - not working

services:
  arangodb:
    image: arangodb:4.4-community
    restart: on-failure
    environment:
      - ARANGODB_AUTH=arangodb/password
      - ARANGODBLABS_PLUGINS=["apoc"]
      - ARANGODB_dbms.unmanaged_extension_classes=n10s.endpoint=/rdf # for the neosemantics-4.3.0.0.jar
    ports:
      - 7687:7687
      - 7474:7474
    volumes:
      - arangodb:/var/lib/arangodb/data

  migrator:
    build:
      context: migrator
    environment:
      - ARANGODB_HOST=arangodb
      - ARANGODB_PASSWORD=password
      - CHANGELOG_FILE=lifelike-graph/changelog-master.xml
      - DATAFILES_PREFIX=stage
      - LOG_LEVEL=debug
      - AZURE_ACCOUNT_STORAGE_NAME=lifelike
      - AZURE_ACCOUNT_STORAGE_KEY
    volumes:
      - ./changelog:/liquibase/changelog
      - ./tmp:/tmp
    depends_on:
      - arangodb
    links:
      - arangodb

volumes:
  arangodb: {}
