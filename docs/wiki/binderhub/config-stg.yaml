config:
  BinderHub:
    auth_enabled: true
    cors_allow_origin: "*"
    hub_url: https://jupyter.lifelike.bio
    image_prefix: lifelikebinderhub.azurecr.io/binderhub/notebooks-
    use_registry: true
  GitHubRepoProvider:
    access_token: # Get this value from our existing Binderhub release (you can find it in the helm chart)
    banned_specs:
      - ^(?!SBRG/|\.).*

  ingress:
    annotations:
    cert-manager.io/cluster-issuer: letsencrypt-stg
      kubernetes.io/ingress.class: nginx
      kubernetes.io/tls-acme: "true"
  enabled: true
  hosts:
    - binder.lifelike.bio
  https:
    enabled: true
    type: letsencrypt
  pathType: Prefix
    tls:
    - hosts:
        - binder.lifelike.bio
      secretName: binder-lifelike-bio-tls

imageCleaner:
  # Turning this off as it does not seem to work on AKS with this version of DinD
  enabled: false

jupyterhub:
  cull:
    concurrency: 10
    enabled: true
    every: 600
    maxAge: 86400
    removeNamedServers: false
    timeout: 1200
    users: false
  hub:
    allowNamedServers: true
    config:
      BinderSpawner:
        auth_enabled: true
        cors_allow_origin: "*"
      GoogleOAuthenticator:
        admin_users:
          - e4sanchez@ucsd.edu
        allow_existing_users: true
        client_id: # Get this value from the Google Cloud Console
        client_secret: # Get this value from the Google Cloud Console
        hosted_domain:
          - ucsd.edu
          - biosustain.dtu.dk
        login_service: Google
        oauth_callback_url: https://jupyter.lifelike.bio/hub/oauth_callback
      JupyterHub:
        admin_access: true
        authenticator_class: google
    consecutiveFailureLimit: 5
    namedServerLimitPerUser: 5
    services:
      binder:
        admin: true
        apiToken: null
        oauth_client_id: service-binderhub
        oauth_no_confirm: true
        oauth_redirect_uri: https://binder.lifelike.bio/oauth_callback
ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-stg
      kubernetes.io/ingress.class: nginx
      kubernetes.io/tls-acme: "true"
  enabled: true
    hosts:
      - jupyter.lifelike.bio
    pathType: Prefix
    tls:
      - hosts:
          - jupyter.lifelike.bio
        secretName: jupyter-lifelike-bio-tls
  proxy:
  https:
    enabled: true
    type: letsencrypt
  rbac:
    enabled: true
  scheduling:
    userScheduler:
      # Turning this off per: https://discourse.jupyter.org/t/singleuser-pods-stuck-in-pending/6349/11
      enabled: false
  singleuser:
    cmd: jupyterhub-singleuser
    cpu:
      guarantee: 0.1
      limit: 1
    defaultUrl: /lab
    extraEnv:
      # Set any required environment variables here, for example:
      ARANGO_PASSWORD: you-real-password
    image:
      # Very important this is present, the singleuser pods need credentials to pull the Jupyterhub image
      pullSecrets: [bindercred]
    memory:
      guarantee: 256M
      limit: 40G
    startTimeout: 300
    storage:
      capacity: 10Gi
      dynamic:
        pvcNameTemplate: 'claim-{username}{servername}'
        storageAccessModes:
          - ReadWriteOnce
        storageClass: standard
        volumeNameTemplate: 'volume-{username}{servername}'
      extraLabels: {}
      extraVolumeMounts: []
      extraVolumes: []
      homeMountPath: /home/jovyan
      static:
        pvcName: null
        subPath: '{username}'
      type: none
    uid: 1000

# Docker is not a supported runtime on AKS, so we must use DinD
dind:
  enabled: true

registry:
  url: # Get this from the desired Azure Container Registry
  username: # Get this from the desired Azure Container Registry
  password: # Get this from the desired Azure Container Registry
