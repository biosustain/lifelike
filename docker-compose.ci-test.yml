# CI Test
version: "3.8"

x-appserver: &appserver
  build:
    context: appserver
    dockerfile: Dockerfile
  image: lifelike.azurecr.io/kg-appserver:${GITHUB_HASH}
  environment:
    - FLASK_DEBUG=1
    - FLASK_ENV=development
    - FLASK_APP=app
    - FLASK_APP_CONFIG=Development
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=postgres
    # Redis
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_USERNAME=default
    - REDIS_PASSWORD=password
    - REDIS_SSL=false
    - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    - ELASTIC_FILE_INDEX_ID=file_ci
    - LMDB_HOME_FOLDER=/home/n4j/neo4japp/services/annotations/lmdb/
    # Arango
    - ARANGO_HOST=http://arangodb:8529
    - ARANGO_USERNAME=root
    - ARANGO_PASSWORD=password
    - ARANGO_DB_NAME=lifelike
  depends_on:
    - postgres
    - elasticsearch
    - redis
    - arangodb

services:
  appserver:
    <<: *appserver
    container_name: appserver

  worker:
    <<: *appserver
    command: rq worker -c rq_config --with-scheduler

  postgres:
    image: postgres:13
    restart: on-failure
    environment:
      - POSTGRES_PASSWORD=postgres

  elasticsearch:
    image: ghcr.io/sbrg/lifelike-elasticsearch:latest
    restart: on-failure
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true

  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --requirepass password

  arangodb:
    image: arangodb:3.9
    container_name: arangodb
    environment:
      ARANGO_ROOT_PASSWORD: password
      LIFELIKE_DB_NAME: lifelike
