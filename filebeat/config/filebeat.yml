filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - condition:
            contains:
              docker.container.image: ${WEBSERVER_IMAGE:kg-webserver}
          config:
            - type: docker
              containers.ids:
                - "${data.docker.container.id}"
            - module: nginx
              access:
                enabled: true
                containers:
                  stream: "stdout"
              error:
                enabled: true
                containers:
                  stream: "stderr"

    - type: docker
      templates:
        - condition:
            contains:
              docker.container.image: ${APPSERVER_IMAGE:kg-appserver}
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              multiline.pattern: "ERROR|INFO|DEBUG|WARN"
              multiline.negate: true
              multiline.match: after

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.logstash:
  hosts:
    - ${LOGSTASH_OUTPUT_HOST:logstash:5044}
